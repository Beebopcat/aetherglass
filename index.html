<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b25"><title>Aetherglass — The restored realm</title><link rel="stylesheet" href="hub.css"><script type="module" src="hub.mjs"></script><link rel="stylesheet" href="interface-icons.css"><link rel="icon" type="image/svg+xml" href="interface-favicon.svg"></head>
<body>
<header class="hub-bar"><a class="brand" href="#goldspire" aria-label="Aetherglass, return to Goldspire"><span class="crystal-mark" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 7 7-2 10-5 3-5-3L5 9Z" fill="var(--icon-fill,#577f6f)"/><path d="m12 2 2 7-2 13-2-13Z" fill="var(--icon-accent,#927744)"/><path d="M5 9h14" fill="none"/></g></svg></span><span>Aetherglass<small>THE RESTORED REALM</small></span></a><div class="bar-actions"><button id="music" aria-pressed="false">Music off</button><button id="journal">Journal <span id="seal-count">0 / 3</span></button></div></header>
<main>
 <section class="world" aria-label="Interactive hub scene">
  <div class="place-heading"><div><p id="scene-subtitle"></p><h1 id="scene-title"></h1></div><button id="back" hidden>Back</button></div>
  <div class="scene-space"><div class="scene-picture" id="scene-picture"><img id="scene-art" alt="" fetchpriority="high"><div id="hotspots"></div><div id="scene-error" hidden role="alert">This scene could not load. You can still use the places list to explore.</div></div></div>
  <div class="scene-caption"><span class="spark" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 9-9 9-9-9Z" fill="var(--icon-accent,#927744)"/></g></svg></span><p id="scene-description"></p><button id="markers" aria-pressed="true" title="Show or hide landmark labels">Labels on</button></div>
 </section>
 <aside class="field-notes" aria-label="Places and current journey"><p class="eyebrow">EXPLORE THIS PLACE</p><nav id="places" aria-label="Scene landmarks"></nav><section class="quest-card"><span class="eyebrow">A LIGHT BETWEEN CITIES</span><h2>Follow the lantern.</h2><p id="objective"></p><div id="seal-icons" aria-label="Study seals"></div></section><p class="save-note" id="save-note">Progress stays in this browser.</p></aside>
</main>
<nav class="travel-bar" aria-label="Travel between cities" id="cities"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><span class="eyebrow" id="panel-kicker"></span><button id="close-panel" aria-label="Close panel"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M19 5 5 19" fill="none"/></g></svg></button></div><h2 id="panel-title"></h2><div id="panel-body"></div></dialog>
<noscript>This interactive hub needs JavaScript. Its original artwork is also available in the website’s Photos gallery.</noscript>
<link rel="stylesheet" href="title-scale.css"></body></html>
